[workspace]
members = [
    "crates/aql-model",
    "crates/aql-adapter-api",
    "crates/aql-catalog",
    "crates/aql-adapter-codex",
    "crates/aql-adapter-kimi-code",
    "crates/aql-adapter-opencode",
    "crates/aql-adapter-claude-code",
    "crates/aql-engine-datafusion",
    "crates/aql-index",
    "crates/aql-config",
    "crates/aql-actions",
    "crates/aql-action-codex",
    "crates/aql-action-kimi-code",
    "crates/aql-action-opencode",
    "crates/aql-action-claude-code",
    "crates/aql-action-synthetic",
    "crates/aql-cli",
    "crates/aql-test-support",
    "crates/aql-release",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
