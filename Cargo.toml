[workspace]
members = [
    "crates/aql-model",
    "crates/aql-adapter-api",
    "crates/aql-catalog",
    "crates/aql-adapter-codex",
    "crates/aql-adapter-kimi-code",
    "crates/aql-adapter-opencode",
    "crates/aql-adapter-claude-code",
    "crates/aql-engine-datafusion",
    "crates/aql-config",
    "crates/aql-cli",
    "crates/aql-test-support",
    "crates/aql-release",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
chrono = "0.4"
clap = "4.6.2"
clap_complete = "4.6.7"
clap_mangen = "0.3.0"
datafusion = { version = "54.0.0", default-features = false }
flate2 = { version = "1.1.9", default-features = false }
futures = "0.3"
hex = "0.4"
hmac = "0.13"
humantime = "2.4"
libc = "0.2"
rand = "0.10"
rusqlite = "0.40"
rustix = "1.1"
rustyline = "18.0"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
sqlparser = "0.62"
tar = "0.4"
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.52"
toml = "1.1"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
