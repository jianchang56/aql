name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    steps:
      - name: Checkout untrusted source without credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup override set 1.88.0
      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Verify current documentation and tool contracts
        run: cargo xtask verify docs
      - name: Reject contaminated committed fixtures
        run: cargo test --locked -p aql-adapter-codex --test fixtures

  capability-gates:
    name: Capability gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    steps:
      - name: Checkout untrusted source without credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup override set 1.88.0
      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Run capability verification
        run: cargo xtask verify
