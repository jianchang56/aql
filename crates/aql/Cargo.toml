[package]
name = "aql"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "aql"
path = "src/main.rs"

[dependencies]
aql-adapter-api = { path = "../aql-adapter-api" }
aql-adapter-claude-code = { path = "../aql-adapter-claude-code" }
aql-adapter-codex = { path = "../aql-adapter-codex" }
aql-adapter-kimi-code = { path = "../aql-adapter-kimi-code" }
aql-adapter-opencode = { path = "../aql-adapter-opencode" }
aql-catalog = { path = "../aql-catalog" }
aql-config = { path = "../aql-config" }
aql-engine-datafusion = { path = "../aql-engine-datafusion" }
aql-fs = { path = "../aql-fs" }
aql-model = { path = "../aql-model" }
cap-std.workspace = true
clap = { workspace = true, features = ["derive", "env", "string"] }
clap_complete.workspace = true
clap_mangen.workspace = true
chrono.workspace = true
datafusion = { workspace = true, features = ["sql"] }
futures.workspace = true
humantime.workspace = true
rand.workspace = true
rustyline.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
unicode-width.workspace = true

[dev-dependencies]
aql-test-support = { path = "../aql-test-support" }

[lints]
workspace = true
